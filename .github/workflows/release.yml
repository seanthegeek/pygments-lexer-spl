name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Needed for PyPI trusted publishing (OIDC) and the GitHub release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check that the tag matches the project version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version v$version"
            exit 1
          fi

      - name: Install and test
        run: |
          python -m pip install -e ".[dev]" build
          python -m pytest

      - name: Build
        run: python -m build

      # Uses PyPI trusted publishing: configure this repository and workflow
      # as a trusted publisher for the project on pypi.org. No API token needed.
      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
